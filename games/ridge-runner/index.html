<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Ridge Runner</title>
<body style="margin:0;background:#000">
<canvas id="c" width="160" height="96" style="width:100%;image-rendering:pixelated"></canvas>
<script>
// Wrapper only: load the module, pass input in, copy its frame to the canvas.
let g = 0;
onkeydown = e => g = e.key == 'ArrowRight' ? 1 : e.key == 'ArrowLeft' ? -1 : g;
onkeyup = () => g = 0;
onpointerdown = e => g = e.clientX > innerWidth / 2 ? 1 : -1;
onpointerup = () => g = 0;
fetch('game.wasm').then(r => r.arrayBuffer()).then(b => WebAssembly.instantiate(b)).then(({ instance: { exports: w } }) => {
  const x = c.getContext('2d'), img = new ImageData(new Uint8ClampedArray(w.memory.buffer, 4096, 61440), 160);
  (function loop() { w.f(g); x.putImageData(img, 0, 0); requestAnimationFrame(loop) })();
});
</script>
